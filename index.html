<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Sabai</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
</head><body>
<script>
(function(){
  var n = 6;
  var parts = [];
  var i = 0;
  function next(){
    if(i >= n){
      document.open();
      document.write(parts.join(""));
      document.close();
      return;
    }
    var x = new XMLHttpRequest();
    x.open("GET", "./h_" + i + ".txt", true);
    x.onload = function(){
      if(x.status !== 200){
        document.body.innerHTML = "<p style=\"color:#fff;padding:20px;font-family:system-ui;background:#0a0a0c\">Load failed: h_" + i + "</p>";
        return;
      }
      parts.push(x.responseText);
      i++;
      next();
    };
    x.onerror = function(){ document.body.innerHTML = "<p style=\"color:#fff;padding:20px\">Network error</p>"; };
    x.send();
  }
  next();
})();
</script>
</body></html>
