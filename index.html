<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Sabai</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<style>body{margin:0;background:#0a0a0c;color:#e8e6e3;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}</style>
</head><body>
<p id="st">Loading Sabai…</p>
<script>
(function(){
  var n = 12;
  var parts = [];
  var i = 0;
  function next(){
    if(i >= n){
      document.open();
      document.write(parts.join(""));
      document.close();
      return;
    }
    var x = new XMLHttpRequest();
    x.open("GET", "./h_" + i + ".txt", true);
    x.onload = function(){
      if(x.status !== 200){
        document.getElementById("st").textContent = "Load failed: h_" + i + " (" + x.status + ")";
        return;
      }
      parts.push(x.responseText);
      i++;
      document.getElementById("st").textContent = "Loading Sabai… " + i + "/" + n;
      next();
    };
    x.onerror = function(){ document.getElementById("st").textContent = "Network error on h_" + i; };
    x.send();
  }
  next();
})();
</script>
</body></html>
