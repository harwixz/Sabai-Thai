<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Sabai</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<style>body{margin:0;background:#0a0a0c;color:#e8e6e3;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}</style>
</head><body>
<p id="st">Loading Sabai…</p>
<script>
(function(){
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
  var n = 70;
  var parts = [];
  var i = 0;
  function next(){
    if(i >= n){
      try {
        var html = decodeURIComponent(escape(atob(parts.join(""))));
        document.open();
        document.write(html);
        document.close();
      } catch(e) {
        document.getElementById("st").textContent = "Decode failed: " + e.message;
      }
      return;
    }
    var x = new XMLHttpRequest();
    x.open("GET", "./b_" + i + ".txt", true);
    x.onload = function(){
      if(x.status !== 200){
        document.getElementById("st").textContent = "Load failed: b_" + i + " (" + x.status + ")";
        return;
      }
      parts.push(x.responseText.replace(/\s/g,""));
      i++;
      document.getElementById("st").textContent = "Loading Sabai… " + i + "/" + n;
      next();
    };
    x.onerror = function(){ document.getElementById("st").textContent = "Network error on b_" + i; };
    x.send();
  }
  next();
})();
</script>
</body></html>
